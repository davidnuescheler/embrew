<form class="pe-form" method="POST" action="https://formsubmit.co/events@emigrationbrewing.com" novalidate>
  <input type="hidden" name="_subject" value="Private Event Enquiry — Emigration Brewing">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="text" name="_honey" class="pe-hp" tabindex="-1" autocomplete="off" aria-hidden="true">

  <div class="pe-row">
    <div class="pe-field">
      <label for="pe-name">Your name</label>
      <input id="pe-name" name="name" type="text" required autocomplete="name">
    </div>
    <div class="pe-field">
      <label for="pe-email">Email</label>
      <input id="pe-email" name="email" type="email" required autocomplete="email">
    </div>
  </div>

  <div class="pe-row">
    <div class="pe-field">
      <label for="pe-phone">Phone</label>
      <input id="pe-phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <div class="pe-field">
      <label for="pe-date">Preferred date</label>
      <input id="pe-date" name="date" type="date">
    </div>
  </div>

  <div class="pe-row">
    <div class="pe-field">
      <label for="pe-guests">Guests</label>
      <input id="pe-guests" name="guests" type="number" min="1" max="200" inputmode="numeric" placeholder="e.g. 40">
    </div>
    <div class="pe-field">
      <label for="pe-space">Space</label>
      <select id="pe-space" name="space">
        <option>Not sure yet — advise me</option>
        <option>Downstairs Dining Room (up to 30)</option>
        <option>Upstairs Dining Hall (up to 55)</option>
        <option>Upper Patio (up to 50, seasonal)</option>
        <option>Full Buyout (135 summer / 85 winter)</option>
      </select>
    </div>
  </div>

  <div class="pe-field">
    <label for="pe-occasion">Occasion &amp; anything else we should know</label>
    <textarea id="pe-occasion" name="occasion" rows="4" placeholder="Rehearsal dinner, birthday, corporate dinner, ceremony…"></textarea>
  </div>

  <button class="button" type="submit">
    Send Enquiry
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>

  <p class="pe-hint">We normally reply within one business day. Prefer to talk? Call <a href="tel:3853585605">(385) 358-5605</a> or email <a href="mailto:events@emigrationbrewing.com">events@emigrationbrewing.com</a>.</p>
  <p class="pe-status" role="status" aria-live="polite" hidden></p>
</form>
